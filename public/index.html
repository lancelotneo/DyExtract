<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<title>Reze Saver · 抖音媒体提取</title>
<meta name="description" content="私人使用的抖音图文与视频解析工具。">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{color-scheme:light;--bg:#f7f8fa;--paper:#fff;--ink:#17191d;--muted:#737985;--line:#e8eaee;--accent:#5b62e8;--accent2:#777df4;--soft:#f0f1ff;--danger:#b42318;--shadow:0 16px 48px rgba(24,30,54,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
button,input{font:inherit}button{cursor:pointer}.shell{width:min(920px,calc(100% - 36px));margin:0 auto;padding:46px 0 36px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:62px}.brand{display:flex;align-items:center;gap:11px;font-weight:750;letter-spacing:-.5px}.mark{width:34px;height:34px;border-radius:11px;background:#17191d;color:white;display:grid;place-items:center;font-size:16px}.private{font-size:12px;color:#656b77;border:1px solid var(--line);border-radius:30px;padding:7px 11px;background:#fff}.hero{text-align:center;margin-bottom:34px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:700}.hero h1{font-size:clamp(32px,6vw,48px);letter-spacing:-1.8px;margin:12px 0 10px;font-weight:760}.hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}.input-label{font-size:12px;color:#555c68;font-weight:650;margin:0 0 10px 2px}.input-row{display:flex;gap:10px}.url-input{flex:1;min-width:0;height:54px;border:1px solid #dfe2e8;border-radius:13px;padding:0 15px;font-size:14px;outline:none;transition:.2s;background:#fff}.url-input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(91,98,232,.1)}.btn{height:54px;border:0;border-radius:13px;padding:0 20px;font-size:14px;font-weight:650;transition:.18s}.btn:disabled{opacity:.55;cursor:wait}.btn-ghost{background:#f2f3f6;color:#343944}.btn-primary{background:var(--ink);color:#fff;min-width:112px}.btn-primary:hover{background:#343844}.hint{margin:12px 2px 0;color:#969ba5;font-size:12px;line-height:1.6}.error{display:none;margin-top:14px;border-radius:12px;padding:12px 14px;color:var(--danger);background:#fff3f1;font-size:13px}.error.show{display:block}.loading{display:none;text-align:center;color:var(--muted);font-size:13px;padding:26px}.loading.show{display:block}.spinner{width:22px;height:22px;border:2px solid #e5e6ef;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}@keyframes spin{to{transform:rotate(360deg)}}.result{display:none;margin-top:22px}.result.show{display:block}.meta{padding:18px 20px;background:#fff;border:1px solid var(--line);border-radius:17px;margin-bottom:15px}.meta-title{font-size:16px;font-weight:700;line-height:1.5}.meta-author{font-size:12px;color:var(--muted);margin-top:5px}.result-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 2px 13px}.result-head h2{font-size:15px;margin:0}.count{font-size:12px;color:var(--muted)}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.image-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.image-wrap{aspect-ratio:4/5;background:#f0f1f4;display:grid;place-items:center;overflow:hidden}.image-wrap img{width:100%;height:100%;object-fit:cover;display:block}.image-foot{padding:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}.image-foot span{font-size:11px;color:var(--muted)}.small-btn{border:0;background:var(--soft);color:#4c52ce;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:650;white-space:nowrap}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.download-all{background:var(--accent);color:white}.subtle{font-size:11px;color:#9297a1;line-height:1.6;margin:12px 2px}.video-box{background:#111;border-radius:16px;overflow:hidden;max-width:560px;margin:0 auto}.video-box video{display:block;width:100%;max-height:70vh}.video-actions{display:flex;justify-content:center;gap:10px;margin-top:15px;flex-wrap:wrap}.link-btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 17px;border-radius:11px;text-decoration:none;background:var(--ink);color:white;font-size:13px;font-weight:650}.link-btn.secondary{background:#f0f1f5;color:#333}.footer{text-align:center;color:#a0a4ad;font-size:11px;margin-top:48px}.footer a{color:#777d89;text-decoration:none}.modal{display:none;position:fixed;inset:0;background:rgba(15,18,28,.86);z-index:10;align-items:center;justify-content:center;padding:22px}.modal.show{display:flex}.modal img{max-width:min(92vw,1100px);max-height:88vh;object-fit:contain}.modal-close{position:absolute;right:20px;top:18px;color:white;background:rgba(255,255,255,.15);border:0;border-radius:50%;width:40px;height:40px;font-size:22px}
@media(max-width:650px){.shell{width:calc(100% - 26px);padding-top:24px}.top{margin-bottom:46px}.hero{margin-bottom:25px}.panel{padding:15px;border-radius:18px}.input-row{display:grid;grid-template-columns:1fr auto}.url-input{grid-column:1/3;width:100%;height:52px}.btn{height:48px}.btn-primary{min-width:0}.btn-ghost{grid-column:1}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.image-foot{padding:8px}.result-head{align-items:flex-start;flex-direction:column}.private{font-size:10px}.hero p{font-size:13px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand"><div class="mark">R</div><span>REZE SAVER</span></div><div class="private">PRIVATE WEB · 仅个人使用</div></header>
<section class="hero"><div class="eyebrow">PERSONAL MEDIA TOOL</div><h1>保存你喜欢的内容</h1><p>粘贴抖音分享链接，提取图文原图或无水印视频。<br>简洁、直接，不设广告与会员。</p></section>
<section class="panel">
<div class="input-label">抖音分享链接</div>
<div class="input-row"><input id="urlInput" class="url-input" type="text" autocomplete="off" placeholder="粘贴分享口令或 https://v.douyin.com/..."><button id="pasteBtn" class="btn btn-ghost" type="button">粘贴</button><button id="parseBtn" class="btn btn-primary" type="button">开始解析</button></div>
<div class="hint">支持抖音图文与视频分享链接。解析结果仅在当前页面展示，不保存你的链接历史。</div>
<div id="errorMsg" class="error" role="alert"></div>
<div id="loading" class="loading"><div class="spinner"></div>正在获取媒体资源…</div>
</section>
<section id="resultBox" class="result">
<div class="meta"><div id="contentTitle" class="meta-title">内容标题</div><div id="authorName" class="meta-author">作者</div></div>
<div id="imagesSection" style="display:none">
<div class="result-head"><div><h2>图片原图</h2><div id="imagesCountLabel" class="count"></div></div><div class="toolbar"><button id="downloadAllBtn" class="btn download-all" style="height:42px;padding:0 15px">打包下载全部</button></div></div>
<div id="imagesGrid" class="gallery"></div>
<p class="subtle">批量下载将生成 ZIP 压缩包。若图片较多，生成过程可能需要一点时间；请保持页面开启。</p>
</div>
<div id="videoSection" style="display:none"><div class="result-head"><h2>视频预览</h2></div><div class="video-box"><video id="videoPlayer" controls playsinline referrerpolicy="no-referrer"></video></div><div class="video-actions"><a id="downloadBtn" class="link-btn" href="#" download>下载无水印视频</a><a id="directBtn" class="link-btn secondary" href="#" target="_blank" rel="noopener">打开原始链接</a></div></div>
</section>
<footer class="footer">REZE SAVER · 个人学习与使用 · 请尊重原作者版权</footer>
</div>
<div id="imageModal" class="modal"><button class="modal-close" id="modalClose" aria-label="关闭">×</button><img id="modalImage" alt="图片预览"></div>
<script>
const $=id=>document.getElementById(id);
let currentImages=[];
let currentVideoUrl='';
function extractUrl(text){if(!text)return '';const short=text.match(/https?:\/\/v\.douyin\.com\/[A-Za-z0-9_-]+\/?/);if(short)return short[0];const long=text.match(/https?:\/\/(www\.)?(iesdouyin|douyin)\.com\/[^\s"'<>]+/);if(long)return long[0];const any=text.match(/https?:\/\/[^\s"'<>]+/);return any?any[0]:'';}
function error(message){$('errorMsg').textContent=message;$('errorMsg').classList.add('show');}
function proxyImage(url){return '/api/entry?action=cover&url='+encodeURIComponent(url);}
function triggerDownload(url,name){const a=document.createElement('a');a.href=url;a.download=name;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();}
async function downloadAllImages(){
 if(!currentImages.length)return;
 const btn=$('downloadAllBtn');if(!window.JSZip){error('压缩组件加载失败，请刷新页面后重试');return;}
 btn.disabled=true;btn.textContent='正在打包…';
 try{
  const zip=new JSZip();let done=0;
  for(let i=0;i<currentImages.length;i++){
   const item=currentImages[i];const url=typeof item==='string'?item:item.url;
   const response=await fetch(proxyImage(url));if(!response.ok)throw new Error('第 '+(i+1)+' 张图片下载失败');
   const blob=await response.blob();const ext=(blob.type.match(/image\/(jpeg|png|webp|gif)/)||[])[1]||'jpg';
   zip.file('Reze_image_'+String(i+1).padStart(2,'0')+'.'+(ext==='jpeg'?'jpg':ext),blob);
   done++;btn.textContent='正在打包 '+done+'/'+currentImages.length;
  }
  const blob=await zip.generateAsync({type:'blob'});const objectUrl=URL.createObjectURL(blob);triggerDownload(objectUrl,'Reze_Saver_images.zip');setTimeout(()=>URL.revokeObjectURL(objectUrl),30000);
  btn.textContent='打包完成';
 }catch(e){error(e.message||'打包失败，请尝试逐张下载');btn.textContent='重试打包下载';}
 finally{btn.disabled=false;if(btn.textContent==='正在打包…')btn.textContent='打包下载全部';}
}
function renderImages(images){
 currentImages=images;$('imagesSection').style.display='block';$('videoSection').style.display='none';$('imagesCountLabel').textContent='共 '+images.length+' 张 · 原图预览';
 const grid=$('imagesGrid');grid.replaceChildren();
 images.forEach((item,index)=>{
  const url=typeof item==='string'?item:item.url;
  const card=document.createElement('article');card.className='image-card';
  const wrap=document.createElement('div');wrap.className='image-wrap';
  const img=document.createElement('img');img.loading='lazy';img.alt='图片 '+(index+1);img.src=proxyImage(url);img.onerror=()=>{img.onerror=null;img.src=url;};img.addEventListener('click',()=>{$('modalImage').src=img.src;$('imageModal').classList.add('show');});
  wrap.appendChild(img);const foot=document.createElement('div');foot.className='image-foot';const label=document.createElement('span');label.textContent='IMAGE '+String(index+1).padStart(2,'0');const button=document.createElement('button');button.className='small-btn';button.textContent='下载原图';button.addEventListener('click',()=>triggerDownload(proxyImage(url),'Reze_image_'+String(index+1).padStart(2,'0')+'.jpg'));foot.append(label,button);card.append(wrap,foot);grid.appendChild(card);
 });
}
async function parseContent(){
 const input=$('urlInput');const url=extractUrl(input.value.trim());
 if(!url){error('请粘贴有效的抖音分享链接或分享口令');return;}
 $('errorMsg').classList.remove('show');$('resultBox').classList.remove('show');$('loading').classList.add('show');$('parseBtn').disabled=true;$('parseBtn').textContent='解析中…';
 try{
  const response=await fetch('/api/entry?action=parse&url='+encodeURIComponent(url));const raw=await response.text();let data;
  try{data=JSON.parse(raw)}catch{throw new Error('解析服务暂不可用，请稍后重试')}
  if(!response.ok||data.error)throw new Error(data.error||'解析失败');
  $('contentTitle').textContent=data.title||'抖音内容';$('authorName').textContent='作者：'+(data.author||'未知');
  if(data.type==='image'&&Array.isArray(data.images)&&data.images.length){renderImages(data.images);}
  else if(data.play_url){
   currentVideoUrl=data.play_url;$('imagesSection').style.display='none';$('videoSection').style.display='block';
   const video=$('videoPlayer');video.src='/api/entry?action=video&url='+encodeURIComponent(data.play_url);video.load();
   $('downloadBtn').href='/api/entry?action=video&url='+encodeURIComponent(data.play_url)+'&download=1';$('directBtn').href=data.play_url;
  }else throw new Error('没有获取到可下载的媒体资源');
  $('resultBox').classList.add('show');
 }catch(e){error(e.message||'解析失败，请检查链接后重试');}
 finally{$('loading').classList.remove('show');$('parseBtn').disabled=false;$('parseBtn').textContent='开始解析';}
}
$('parseBtn').addEventListener('click',parseContent);$('urlInput').addEventListener('keydown',e=>{if(e.key==='Enter')parseContent();});
$('pasteBtn').addEventListener('click',async()=>{try{const text=await navigator.clipboard.readText();if(text){$('urlInput').value=text;$('pasteBtn').textContent='已粘贴';setTimeout(()=>$('pasteBtn').textContent='粘贴',1400)}else $('urlInput').focus();}catch{$('urlInput').focus();$('urlInput').placeholder='请在此处长按并粘贴分享链接';}});
$('downloadAllBtn').addEventListener('click',downloadAllImages);
$('modalClose').addEventListener('click',()=>$('imageModal').classList.remove('show'));$('imageModal').addEventListener('click',e=>{if(e.target===$('imageModal'))$('imageModal').classList.remove('show')});
</script>
</body></html>
